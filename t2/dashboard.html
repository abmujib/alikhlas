<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMKeu Al-Ikhlas | Dashboard</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth.js"></script>

    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
        }

        .stat-card {
            color: white;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .bg-income {
            background: linear-gradient(45deg, #28a745, #85e085);
        }

        .bg-expense {
            background: linear-gradient(45deg, #dc3545, #ff6b6b);
        }

        .bg-balance {
            background: linear-gradient(45deg, #007bff, #66b2ff);
        }

        /* Gaya Kartu Navigasi */
        .nav-card {
            transition: 0.2s;
            cursor: pointer;
            text-decoration: none !important;
        }

        .nav-card:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="img/logo-white.png" alt="Logo" width="35">
                <b>SIM</b><i>Keu</i>
            </a>
            <div class="ms-auto dropdown">
                <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-user-circle fs-5 me-2"></i>
                    <span id="welcomeText"></span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li><button onclick="logout()" class="dropdown-item"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-income p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Total Pemasukan</p>
                            <h3 class="fw-bold mb-0" id="totalPemasukan">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-arrow-down-long fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-expense p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Total Pengeluaran</p>
                            <h3 class="fw-bold mb-0" id="totalPengeluaran">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-arrow-up-long fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-balance p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Saldo Kas</p>
                            <h3 class="fw-bold mb-0" id="totalSaldo">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-wallet fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3 text-success">
                            <i class="fa-solid fa-arrow-down-long me-2"></i>Rincian Pemasukan
                        </h6>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Kategori</th>
                                        <th class="text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="tableKategoriMasuk">
                                </tbody>
                                <tfoot id="footKategoriMasuk">
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3 text-danger">
                            <i class="fa-solid fa-arrow-up-long me-2"></i>Rincian Pengeluaran
                        </h6>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Kategori</th>
                                        <th class="text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="tableKategoriKeluar">
                                </tbody>
                                <tfoot id="footKategoriKeluar">
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6">
                <a href="transaksi.html" class="nav-card">
                    <div class="card bg-primary text-white shadow-sm h-100">
                        <div class="card-body p-4 text-center">
                            <i class="fa-solid fa-cash-register fa-2x mb-2"></i>
                            <h6 class="fw-bold mb-0">Catat Transaksi</h6>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-6">
                <a href="laporan.html" class="nav-card">
                    <div class="card bg-dark text-white shadow-sm h-100">
                        <div class="card-body p-4 text-center">
                            <i class="fa-solid fa-file-lines fa-2x mb-2"></i>
                            <h6 class="fw-bold mb-0">Lihat Laporan</h6>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbycBmGazyzO0JzuPYDpSi8AUV45gA5pGKnlyuVj3Yh4cjZhljFfEdG54tIsXGMiNI1Fwg/exec";

        $(document).ready(function() {
            loadData();
        });

        function loadData() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    let totalIn = 0,
                        totalOut = 0;
                    let katIn = {};
                    let katOut = {};

                    data.forEach(t => {
                        let jenis = t.jenis.toString().toUpperCase();
                        let kategori = t.kategori || "LAINNYA";
                        let nom = parseInt(t.nominal) || 0;

                        if (jenis === 'PEMASUKAN') {
                            totalIn += nom;
                            katIn[kategori] = (katIn[kategori] || 0) + nom;
                        } else {
                            totalOut += nom;
                            katOut[kategori] = (katOut[kategori] || 0) + nom;
                        }
                    });

                    let saldoAkhir = totalIn - totalOut;

                    // Update UI Teks
                    $("#totalPemasukan").text(formatRupiah(totalIn));
                    $("#totalPengeluaran").text(formatRupiah(totalOut));
                    $("#totalSaldo").text(formatSaldo(saldoAkhir));

                    // Render Tabel
                    renderTableWithTotal(katIn, 'tableKategoriMasuk', 'footKategoriMasuk', 'text-success');
                    renderTableWithTotal(katOut, 'tableKategoriKeluar', 'footKategoriKeluar', 'text-danger');
                })
                .catch(err => {
                    console.error("Error:", err);
                    Swal.fire("Error", "Gagal sinkronisasi data", "error");
                });
        }

        function renderTableWithTotal(objData, bodyId, footId, textClass) {
            let bodyHtml = "";
            let footHtml = "";
            let grandTotal = 0;
            let entries = Object.entries(objData);

            entries.sort((a, b) => b[1] - a[1]);

            if (entries.length === 0) {
                bodyHtml = `<tr><td colspan="2" class="text-center text-muted small py-3">Belum ada transaksi</td></tr>`;
            } else {
                entries.forEach(([kat, subtotal]) => {
                    grandTotal += subtotal;
                    bodyHtml += `
                    <tr>
                        <td class="small">${kat}</td>
                        <td class="text-end small fw-bold text-secondary">${formatRupiah(subtotal)}</td>
                    </tr>`;
                });

                footHtml = `
                <tr>
                    <td class="text-uppercase">TOTAL</td>
                    <td class="text-end ${textClass}">${formatRupiah(grandTotal)}</td>
                </tr>`;
            }

            $(`#${bodyId}`).html(bodyHtml);
            $(`#${footId}`).html(footHtml);
        }

        function formatRupiah(n) {
            return "Rp " + Math.abs(n).toLocaleString('id-ID');
        }

        function formatSaldo(n) {
            let prefix = n < 0 ? "- Rp " : "Rp ";
            return prefix + Math.abs(n).toLocaleString('id-ID');
        }
    </script>

</body>

</html>
