<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMKeu Al-Ikhlas | Login</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f8f9fa;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            border-radius: 18px;
            border: none;
        }

        .form-control {
            height: 48px;
            border-radius: 12px;
        }

        .btn-primary {
            height: 50px;
            border-radius: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img src="img/logo-black.png" height="100" />
                            <h4><b>SIM</b><i>Keu</i> <b>AL-IKHLAS</b></h4>
                            <p class="text-muted">Transparansi Dana Umat</p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" name="username" placeholder="Username here" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control pe-5" name="password" id="passwordInput" placeholder="Password here" required>
                                    <i class="fa-solid fa-eye position-absolute" id="togglePassword" style="right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6c757d;"></i>
                                </div>
                            </div>
                            <p class="small mb-3 text-center text-muted">Need help? Contact Admin.</p>
                            <button type="submit" id="loginBtn" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="text-center mt-4 small text-muted">&copy; 2026 <strong>Masjid Al-Ikhlas Cikontrang</strong>
                            <br>Version <strong>1.0</strong> Made with ☕
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbycBmGazyzO0JzuPYDpSi8AUV45gA5pGKnlyuVj3Yh4cjZhljFfEdG54tIsXGMiNI1Fwg/exec";

        // Cek jika sudah login, langsung lempar ke pelanggan.html
        if (localStorage.getItem("token")) {
            window.location.href = "dashboard.html";
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerText = "Memverifikasi...";

            const formData = new FormData(this);
            formData.append("action", "login");

            fetch(scriptURL, {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(response => {
                    if (response.status === "success") {
                        // Simpan semua data krusial ke penyimpanan lokal
                        localStorage.setItem("token", response.token);
                        localStorage.setItem("role", response.role);
                        localStorage.setItem("username", formData.get("username"));
                        localStorage.setItem("nama_lengkap", response.nama);

                        // Arahkan otomatis berdasarkan Role dari Spreadsheet
                        if (response.role === "Admin") {
                            window.location.href = "dashboard.html";
                        } else if (response.role === "Bendahara") {
                            window.location.href = "transaksi.html";
                        } else {
                            // Ketua dan Umum langsung ke laporan
                            window.location.href = "laporan.html";
                        }
                    } else {
                        btn.disabled = false;
                        btn.innerText = "Login";
                        Swal.fire("Gagal", response.message, "error");
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerText = "Login";
                    Swal.fire("Error", "Gagal menghubungi server", "error");
                });
        });

        /* ================= TOGGLE PASSWORD ================= */
        document.getElementById("togglePassword").addEventListener("click", function() {
            const passwordInput = document.getElementById("passwordInput");
            const icon = this;
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        });
    </script>
</body>

</html>
