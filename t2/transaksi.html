<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMKeu Al-Ikhlas | Transaksi</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth.js"></script>

    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 15px; border: none; }
        .stat-card { color: white; transition: 0.3s; cursor: default; }
        .stat-card:hover { transform: translateY(-5px); }
        .table-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .btn-action { border-radius: 10px; font-weight: 600; }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="img/logo-white.png" alt="Logo" width="35">
                <b>SIM</b><i>Keu</i>
            </a>
            <div class="ms-auto dropdown">
                <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-user-circle fs-5 me-2"></i>
                    <span id="welcomeText"></span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li><button onclick="logout()" class="dropdown-item"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm p-4">
                    <h5 class="fw-bold mb-3" id="formTitle">Catat Transaksi</h5>
                    <form id="financeForm">
                        <input type="hidden" id="transId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tanggal</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Jenis Transaksi</label>
                            <select class="form-select" id="jenis" required>
                                <option value="">Pilih Jenis</option>
                                <option value="PEMASUKAN">PEMASUKAN</option>
                                <option value="PENGELUARAN">PENGELUARAN</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Kategori Transaksi</label>
                            <select class="form-select" id="kategori" required>
                                <option value="">Pilih Kategori</option>
                                <option value="INFAQ">INFAQ</option>
                                <option value="IURAN">IURAN</option>
                                <option value="PERELEK">PERELEK</option>
                                <option value="PEMBANGUNAN">PEMBANGUNAN</option>
                                <option value="OPERASIONAL">OPERASIONAL</option>
                                <option value="PEMELIHARAAN">PEMELIHARAAN</option>
                                <option value="PINJAMAN">PINJAMAN</option>
                                <option value="LAINNYA">LAINNYA</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nominal (Rp)</label>
                            <input type="number" class="form-control" id="nominal" required placeholder="Contoh: 50000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Keterangan</label>
                            <textarea class="form-control" id="keterangan" rows="2" placeholder="Catatan tambahan..."></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-action shadow-sm">SIMPAN DATA</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary w-100 mt-2 btn-action d-none" onclick="resetForm()">BATAL EDIT</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="table-container shadow-sm">
                    <h5 class="fw-bold mb-3">Riwayat Transaksi</h5>
                    <div class="table-responsive">
                        <table id="mainTable" class="table table-hover w-100">
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Jenis</th>
                                    <th>Kategori</th>
                                    <th>Nominal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="transactionList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const scriptURL = CONFIG.STRIP_URL;
        let table;

        $(document).ready(function() {
            // Inisialisasi DataTable dengan sorting default DESC pada kolom 0
            table = $('#mainTable').DataTable({
                "order": [[0, "desc"]],
                "pageLength": 10,
                "language": { "url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/id.json" }
            });
            loadData();
        });

        function loadData() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    table.clear();
                    
                    // Mengurutkan data terbaru
                    data.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

                    data.forEach(t => {
                        let isInc = t.jenis.toString().toUpperCase() === 'PEMASUKAN'; 
                        let nom = parseInt(t.nominal) || 0;

                        // Membuat Badge untuk Jenis Transaksi
                        let badgeJenis = isInc 
                            ? '<span class="badge bg-success">PEMASUKAN</span>' 
                            : '<span class="badge bg-danger">PENGELUARAN</span>';

                        let tglMurni = t.tanggal.split("T")[0];

                        table.row.add([
                            // Kolom Tanggal
                            `<span style="display:none;">${tglMurni}</span>${formatTglTabel(t.tanggal)}`,
                            // Kolom Jenis (Baru)
                            badgeJenis,
                            // Kolom Kategori
                            `<b>${t.kategori}</b><br><small class="text-muted">${t.keterangan || '-'}</small>`,
                            // Kolom Nominal
                            `<span class="${isInc ? 'text-success' : 'text-danger'} fw-bold">${formatRupiah(nom)}</span>`,
                            // Kolom Aksi
                            `<div class="btn-group">
                                <button class="btn btn-sm btn-light text-primary border" onclick="prepareEdit('${t.id}','${tglMurni}','${t.jenis}','${t.kategori}','${nom}','${t.keterangan}')"><i class="fa fa-edit"></i></button>
                                <button class="btn btn-sm btn-light text-danger border" onclick="deleteItem('${t.id}')"><i class="fa fa-trash"></i></button>
                            </div>`
                        ]);
                    });

                    table.draw();
                })
                .catch(err => console.error("Error loading data:", err));
        }

        $("#financeForm").on("submit", function(e) {
            e.preventDefault();
            let action = $("#transId").val() ? "update" : "insert";
            let btn = $("#submitBtn").prop('disabled', true).text("Memproses...");

            let payload = {
                action: action,
                id: $("#transId").val(),
                tanggal: $("#tanggal").val(),
                jenis: $("#jenis").val(),
                kategori: $("#kategori").val(),
                nominal: $("#nominal").val(),
                keterangan: $("#keterangan").val()
            };

            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                Swal.fire("Berhasil", "Data sedang disinkronkan ke server", "success");
                resetForm();
                setTimeout(loadData, 2000);
            })
            .catch(err => {
                Swal.fire("Error", "Gagal menghubungi server", "error");
                btn.prop('disabled', false).text("SIMPAN DATA");
            });
        });

        function prepareEdit(id, tgl, jenis, kat, nom, ket) {
            $("#transId").val(id);
            // Menggunakan tgl yang sudah bersih (YYYY-MM-DD) tanpa konversi Date
            $("#tanggal").val(tgl);
            $("#jenis").val(jenis);
            $("#kategori").val(kat);
            $("#nominal").val(nom);
            $("#keterangan").val(ket);

            $("#formTitle").text("Edit Transaksi");
            $("#submitBtn").text("UPDATE DATA").addClass("btn-warning");
            $("#cancelBtn").removeClass("d-none");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            $("#financeForm")[0].reset();
            $("#transId").val("");
            $("#formTitle").text("Catat Transaksi");
            $("#submitBtn").text("SIMPAN DATA").removeClass("btn-warning").prop('disabled', false);
            $("#cancelBtn").addClass("d-none");
        }

        function deleteItem(id) {
            Swal.fire({
                title: "Hapus data ini?",
                text: "Data yang dihapus tidak bisa dikembalikan!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                confirmButtonText: 'Ya, Hapus!'
            }).then(r => {
                if (r.isConfirmed) {
                    fetch(scriptURL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify({ action: "delete", id: id })
                    }).then(() => {
                        Swal.fire("Dihapus", "Data dalam proses penghapusan", "success");
                        setTimeout(loadData, 2000);
                    });
                }
            });
        }

        function formatRupiah(n) { return "Rp " + Math.abs(n).toLocaleString('id-ID'); }

        function formatSaldo(n) {
            let prefix = n < 0 ? "- Rp " : "Rp ";
            return prefix + Math.abs(n).toLocaleString('id-ID');
        }

        function formatTglTabel(s) { 
            if(!s) return "-";
            // Memecah string manual untuk menghindari bug timezone (-1 hari)
            let datePart = s.split("T")[0];
            let p = datePart.split("-");
            if(p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`; // Hasil: DD/MM/YYYY
            return s;
        }
    </script>
</body>
</html>
