<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Al-Ikhlas - Dashboard Keuangan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: none;
        }

        .stat-card {
            color: white;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .bg-income {
            background: linear-gradient(45deg, #28a745, #85e085);
        }

        .bg-expense {
            background: linear-gradient(45deg, #dc3545, #ff6b6b);
        }

        .bg-balance {
            background: linear-gradient(45deg, #007bff, #66b2ff);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-action {
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-mosque me-2"></i>AL-IKHLAS</a>
            <div class="ms-auto">
                <span class="text-white me-3"><i class="fa-solid fa-user-circle me-1"></i> <span id="userNameDisplay">Admin</span></span>
                <button onclick="logout()" class="btn btn-sm btn-outline-light">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card bg-income p-3">
                    <div class="d-flex justify-content-between">
                        <div>
                            <p class="mb-1">Total Pemasukan</p>
                            <h3 class="fw-bold" id="totalPemasukan">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-arrow-down fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-expense p-3">
                    <div class="d-flex justify-content-between">
                        <div>
                            <p class="mb-1">Total Pengeluaran</p>
                            <h3 class="fw-bold" id="totalPengeluaran">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-arrow-up fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-balance p-3">
                    <div class="d-flex justify-content-between">
                        <div>
                            <p class="mb-1">Saldo Kas</p>
                            <h3 class="fw-bold" id="totalSaldo">Rp 0</h3>
                        </div>
                        <i class="fa-solid fa-wallet fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm p-4">
                    <h5 class="fw-bold mb-3" id="formTitle">Catat Transaksi</h5>
                    <form id="financeForm">
                        <input type="hidden" id="transId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tanggal</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Jenis</label>
                            <select class="form-select" id="jenis" required>
                                <option value="pemasukan">Pemasukan (In)</option>
                                <option value="pengeluaran">Pengeluaran (Out)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Kategori</label>
                            <select class="form-select" id="kategori" required>
                                <option value="Kotak Amal">Kotak Amal</option>
                                <option value="Infaq">Infaq</option>
                                <option value="Iuran">Iuran</option>
                                <option value="Operasional">Operasional</option>
                                <option value="Pemeliharaan">Pemeliharaan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nominal (Rp)</label>
                            <input type="number" class="form-control" id="nominal" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Keterangan</label>
                            <textarea class="form-control" id="keterangan" rows="2"></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-action">SIMPAN DATA</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary w-100 mt-2 btn-action d-none" onclick="resetForm()">BATAL EDIT</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="table-container shadow-sm">
                    <h5 class="fw-bold mb-3">Riwayat Transaksi</h5>
                    <div class="table-responsive">
                        <table id="mainTable" class="table table-hover w-100">
                            <thead>
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Kategori</th>
                                    <th>Nominal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="transactionList">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbycBmGazyzO0JzuPYDpSi8AUV45gA5pGKnlyuVj3Yh4cjZhljFfEdG54tIsXGMiNI1Fwg/exec";
        let table; // Variabel global untuk DataTable

        $(document).ready(function() {
            // Inisialisasi DataTable pertama kali
            table = $('#mainTable').DataTable({
                "order": [
                    [0, "desc"]
                ], // Urutkan berdasarkan tanggal terbaru
                "pageLength": 10,
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/id.json" // Bahasa Indonesia
                }
            });
            loadData();
        });

        function loadData() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    // Hapus data lama di DataTable
                    table.clear();

                    let totalIn = 0,
                        totalOut = 0;

                    data.forEach(t => {
                        let isInc = t.jenis === 'pemasukan';
                        let nom = parseInt(t.nominal) || 0;
                        if (isInc) totalIn += nom;
                        else totalOut += nom;

                        // Tambahkan baris ke DataTable
                        table.row.add([
                            `<small>${formatTglTabel(t.tanggal)}</small>`,
                            `<b>${t.kategori}</b><br><small class="text-muted">${t.keterangan || '-'}</small>`,
                            `<span class="${isInc ? 'text-success' : 'text-danger'} fw-bold">${formatRupiah(nom)}</span>`,
                            `<div class="btn-group">
                            <button class="btn btn-sm btn-light text-primary" onclick="prepareEdit('${t.id}','${t.tanggal}','${t.jenis}','${t.kategori}','${nom}','${t.keterangan}')"><i class="fa fa-edit"></i></button>
                            <button class="btn btn-sm btn-light text-danger" onclick="deleteItem('${t.id}')"><i class="fa fa-trash"></i></button>
                        </div>`
                        ]);
                    });

                    // Gambar ulang tabel dengan data baru
                    table.draw();

                    // Update Ringkasan Saldo
                    $("#totalPemasukan").text(formatRupiah(totalIn));
                    $("#totalPengeluaran").text(formatRupiah(totalOut));
                    $("#totalSaldo").text(formatRupiah(totalIn - totalOut));
                })
                .catch(err => console.error("Error loading data:", err));
        }

        $("#financeForm").on("submit", function(e) {
            e.preventDefault();
            let action = $("#transId").val() ? "update" : "insert";
            let btn = $("#submitBtn").prop('disabled', true).text("Memproses...");

            let payload = {
                action: action,
                id: $("#transId").val(),
                tanggal: $("#tanggal").val(),
                jenis: $("#jenis").val(),
                kategori: $("#kategori").val(),
                nominal: $("#nominal").val(),
                keterangan: $("#keterangan").val()
            };

            fetch(scriptURL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain"
                    },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    Swal.fire("Berhasil", "Data sedang diproses ke server", "success");
                    resetForm();
                    setTimeout(loadData, 2000);
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("Error", "Gagal menghubungi server", "error");
                    btn.prop('disabled', false).text("SIMPAN DATA");
                });
        });

        function prepareEdit(id, tgl, jenis, kat, nom, ket) {
            $("#transId").val(id);

            // Perbaikan Format Tanggal ISO ke YYYY-MM-DD
            let formattedDate = tgl;
            if (tgl.includes("T")) {
                formattedDate = tgl.split("T")[0];
            }

            $("#tanggal").val(formattedDate);
            $("#jenis").val(jenis);
            $("#kategori").val(kat);
            $("#nominal").val(nom);
            $("#keterangan").val(ket);

            $("#formTitle").text("Edit Transaksi");
            $("#submitBtn").text("UPDATE DATA").addClass("btn-warning");
            $("#cancelBtn").removeClass("d-none");
            window.scrollTo(0, 0);
        }

        function resetForm() {
            $("#financeForm")[0].reset();
            $("#transId").val("");
            $("#formTitle").text("Catat Transaksi");
            $("#submitBtn").text("SIMPAN DATA").removeClass("btn-warning").prop('disabled', false);
            $("#cancelBtn").addClass("d-none");
        }

        function deleteItem(id) {
            Swal.fire({
                title: "Hapus data ini?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: '#dc3545'
            }).then(r => {
                if (r.isConfirmed) {
                    fetch(scriptURL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: {
                                "Content-Type": "text/plain"
                            },
                            body: JSON.stringify({
                                action: "delete",
                                id: id
                            })
                        })
                        .then(() => {
                            Swal.fire("Dihapus", "Data dalam proses penghapusan", "success");
                            setTimeout(loadData, 2000);
                        });
                }
            });
        }

        function formatRupiah(n) {
            return "Rp " + Math.abs(n).toLocaleString('id-ID');
        }

        function formatTglTabel(s) {
            if (!s) return "-";
            let d = new Date(s);
            return d.toLocaleDateString('id-ID');
        }

        function logout() {
            localStorage.clear();
            window.location.reload();
        }
    </script>
</body>

</html>
